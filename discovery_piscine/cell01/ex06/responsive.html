<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Tab</title>

    <style>
      html,
      body {
        margin: 0;
      }

      .table {
        display: flex;
        width: 100%;
      }

      .box {
        border: 1px solid black;
        width: 20%;
        min-height: 150px;
        padding: 30px 0px;
        flex-shrink: 1;
      }

      .box1 {
        background-color: lightgreen;
      }

      .box2 {
        background-color: lightsalmon;
      }

      .box3 {
        background-color: lightpink;
      }

      .box4 {
        background-color: lightblue;
      }

      .box5 {
        background-color: lightgrey;
      }
    </style>
  </head>

  <body>
    <div class="table">
      <div class="box box1">First Cell</div>
      <div class="box box2">Second Cell</div>
      <div class="box box3">Third Cell</div>
      <div class="box box4">Fourth Cell</div>
      <div class="box box5">Fifth Cell</div>
    </div>
  </body>
</html>

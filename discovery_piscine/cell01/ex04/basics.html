<!DOCTYPE html>
<html>
<head>
    <title>Basics</title>

    <style>
        body {
            background-color: pink;
        }

        h1 {
            color: white;
            text-align: center;
            font-size: 40px;
        }

        .shops {
            display: flex;
            justify-content: center;
            gap: 30px;
        }

        .shop {
            text-align: center;
        }

        .shop img {
            width: 300px;
            height: 200px;
            object-fit: contain;
        }

        hr {
            width: 100%;
        }

        .copyright {
            text-align: right;
            font-family: monospace;
            font-style: italic;
        }
    </style>
</head>

<body>

    <h1>Basics &amp; Online Shops</h1>

    <div class="shops">

        <div class="shop">
            <img src="https://www.popticles.com/wp-content/uploads/2024/04/Amazon_The_Most_Valuable_Brands_2023.jpg" alt="Online Shop 1">
            <br>
            <a href="https://www.amazon.com">Amazon</a>
        </div>

        <div class="shop">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSltTvkqEB9hCS4aw1Y3qFuSZuiCZd0pxvJTZS2iJpSMw&s=10" alt="Online Shop 2">
            <br>
            <a href="https://www.ebay.com">eBay</a>
        </div>

    </div>

    <hr>

    <p class="copyright">&copy; yourlogin 2026</p>

</body>
</html>
